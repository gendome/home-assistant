[project]
name = "gendome-home-assistant"
version = "1.0.0"
description = "Gendome Cloud custom integration for Home Assistant"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[project.optional-dependencies]
test = [
  "homeassistant>=2024.8.0",
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.9"
]
